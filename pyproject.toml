[project]
name = "hwpx-builder"
version = "0.1.1"
description = "Declarative, Excel-backed HWPX document compiler"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5,<4",
    "defusedxml>=0.7.1,<1",
    "Pillow>=11,<13",
    "python-hwpx==2.29.2",
    "pyyaml>=6.0.3,<7",
]

[project.urls]
Repository = "https://github.com/sksla123/hwpx-builder"
Issues = "https://github.com/sksla123/hwpx-builder/issues"

[project.scripts]
hwpx-builder = "hwpx_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.14,<1",
]
release = [
    "pyinstaller>=6.16,<7",
]

[tool.pytest.ini_options]
addopts = "-n auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE", "pyproject.toml"]
